[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-decisions"
version = "0.1.0"
description = "Typed decisions with calibrated probabilities in a single forward pass."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.8",
  "transformers>=5.17",
  "peft>=0.21",
  "huggingface_hub",
  "numpy",
]

[project.optional-dependencies]
cuda = ["flash-linear-attention>=0.5"]
serve = ["fastapi", "uvicorn", "pydantic>=2"]
test = ["pytest>=8"]

[project.scripts]
sieve-serve = "sieve.serve:main"
sieve-eval = "sieve.evaluate:main"

[tool.setuptools.packages.find]
include = ["sieve*"]
